{% extends "base.html" %}
{% block title %}{{ code }} · Diabetes Clinical AI{% endblock %}
{% block content %}
<div class="empty-state text-center py-5">
  <i class="bi bi-exclamation-diamond text-primary"></i>
  <h1 class="display-1 fw-bold text-primary">{{ code }}</h1>
  <h2 class="fw-bold">{{ title }}</h2>
  <p class="text-muted mx-auto" style="max-width: 620px;">{{ message }}</p>
  <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
    <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4"><i class="bi bi-house me-2"></i>Kembali ke Dashboard</a>
    <a href="{{ url_for('prediction_guide') }}" class="btn btn-outline-primary rounded-pill px-4"><i class="bi bi-compass me-2"></i>Buka Guide</a>
  </div>
</div>
{% endblock %}
